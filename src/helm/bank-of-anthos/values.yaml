# Helm Values для Bank of Anthos

## Конфигурация с построчными комментариями

```yaml
imageRepo: "us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos"
                                     # Базовый путь к репозиторию образов (по умолчанию — Google Artifact Registry)
imageTag: "v0.6.9"                   # Версия (тег) образов всех микросервисов
imagePullPolicy: IfNotPresent        # Политика загрузки: тянуть образ только если его нет на ноде

appVersion: "v0.6.9"                 # Версия приложения, прокидывается в env-переменные подов

environment:                         # Общие переменные окружения для сервисов
  localRoutingNum: "883745000"       # Локальный банковский маршрутный номер (имитация SWIFT/BIC)
  pubKeyPath: "/tmp/.ssh/publickey"  # Путь к публичному ключу JWT внутри контейнера
  privKeyPath: "/tmp/.ssh/privatekey" # Путь к приватному ключу JWT внутри контейнера

demo:                                # Настройки демо-режима
  useDemoData: "True"                # Включить генерацию тестовых данных при старте
  username: "testuser"               # Логин демо-пользователя
  password: "bankofanthos"           # Пароль демо-пользователя

jwt:                                 # Настройки JWT-аутентификации между сервисами
  secretName: "jwt-key"              # Имя Kubernetes Secret с ключами
  privateKey: ""                     # Приватный ключ (пусто — берётся из существующего Secret)
  publicKey: ""                      # Публичный ключ (аналогично)

accountsDb:                          # Параметры подключения к БД аккаунтов
  postgresDb: "accounts-db"          # Имя базы данных
  postgresUser: "accounts-admin"     # Пользователь PostgreSQL
  postgresPassword: "accounts-pwd"   # Пароль (в production должен быть в Secret)

ledgerDb:                            # Параметры подключения к БД журнала транзакций
  postgresDb: "postgresdb"           # Имя базы данных
  postgresUser: "admin"              # Пользователь PostgreSQL
  postgresPassword: "password"       # Пароль (в production должен быть в Secret)

replicas:                            # Количество реплик каждого микросервиса
  frontend: 1                        # Веб-интерфейс
  userservice: 1                     # Сервис пользователей
  contacts: 1                        # Сервис контактов
  balancereader: 1                   # Сервис чтения баланса
  ledgerwriter: 1                    # Сервис записи в журнал
  transactionhistory: 1              # Сервис истории транзакций

loadgenerator:                       # Нагрузочный генератор (Locust)
  enabled: false                     # Отключён — не тратим ресурсы кластера
  users: 5                           # Количество виртуальных пользователей при включении

ingress:                             # Настройки внешнего доступа к приложению
  enabled: true                      # Создавать Ingress-ресурс
  className: "nginx"                 # IngressClass — используется NGINX Ingress Controller
  host: "bank.10.174.8.95.nip.io"    # Внешний DNS-хост через сервис nip.io (без своего DNS)
  tls:                               # Настройки HTTPS
    enabled: false                   # TLS выключен (демо-окружение, HTTP)
    issuer: "my-ca-issuer"           # cert-manager Issuer для выпуска сертификата
    secretName: "bank-tls"           # Имя Secret для хранения TLS-сертификата

# Антиаффинити: разносить реплики одного сервиса по разным нодам (мягкое правило)
antiAffinity:                        # Настройка распределения подов по нодам
  enabled: true                      # Включить podAntiAffinity (preferredDuringScheduling)
```

---

## Монолог для защиты (≈300 слов)

Уважаемая комиссия, представляю **values-файл Helm-чарта** для микросервисного приложения **Bank of Anthos**. Этот файл является **единой точкой конфигурации** всего приложения и позволяет управлять всеми параметрами развёртывания декларативно, без правки шаблонов.

В верхней части файла задаются **параметры образов**: репозиторий, тег и политика загрузки. Использование `IfNotPresent` снижает нагрузку на сеть и ускоряет запуск подов, так как образ скачивается только при отсутствии. В CI/CD-пайплайне эти значения **переопределяются на лету** через `--set imageRepo` и `--set imageTag`, что позволяет подставлять SHA коммита и адрес внутреннего registry.

Блок **environment** содержит общие переменные для всех сервисов: маршрутный банковский номер и пути к JWT-ключам. JWT используется для **межсервисной аутентификации** — каждый сервис проверяет токены публичным ключом, а только userservice выпускает их приватным. Это реализует **zero-trust** подход внутри кластера.

Блок **demo** включает генерацию тестовых данных и создание демо-пользователя — это удобно для презентаций и QA, но в production должно отключаться. Параметры **баз данных** разделены: accounts-db и ledger-db — две независимые PostgreSQL-инстанции, что соответствует принципу **database per service** микросервисной архитектуры.

Секция **replicas** задаёт количество подов каждого сервиса. В демо-окружении установлено по одной реплике, но для production это легко масштабируется. **Loadgenerator** отключён — он нужен только для нагрузочного тестирования.

Блок **ingress** конфигурирует внешний доступ через **NGINX Ingress Controller**. Использование сервиса **nip.io** избавляет от необходимости настраивать реальный DNS — он автоматически резолвит поддомен в указанный IP. TLS отключён для упрощения, но при необходимости интегрируется с **cert-manager** через указанный Issuer.

Особо выделю **antiAffinity** — это правило заставляет планировщик Kubernetes размещать реплики одного сервиса на **разных нодах**. Использовано мягкое правило (preferred), что повышает **отказоустойчивость**: падение одной ноды не приведёт к полной недоступности сервиса, но и не заблокирует деплой при нехватке нод.

Таким образом, values-файл обеспечивает **гибкость, безопасность и отказоустойчивость** конфигурации.
