apiVersion: v2
name: bank-of-anthos
description: Helm-чарт для развёртывания приложения Bank of Anthos (6 микросервисов + 2 БД + фронтенд) в Kubernetes
type: application
version: 0.1.0
appVersion: "v0.6.0"



# Chart.yaml для Bank of Anthos

## Конфигурация с построчными комментариями

```yaml
apiVersion: v2                       # Версия API Helm-чарта; v2 — для Helm 3, поддерживает зависимости в Chart.yaml
name: bank-of-anthos                 # Имя чарта; используется при установке (helm install <name> <chart>)
description: Helm-чарт для развёртывания приложения Bank of Anthos (6 микросервисов + 2 БД + фронтенд) в Kubernetes
                                     # Краткое описание назначения чарта (отображается в helm search/list)
type: application                    # Тип чарта: application — обычное приложение; альтернатива — library (вспомогательный)
version: 0.1.0                       # Версия самого чарта (SemVer); инкрементируется при изменении шаблонов
appVersion: "v0.6.0"                 # Версия приложения, которое разворачивает чарт; информационное поле
```

---

## Монолог для защиты (≈300 слов)

Уважаемая комиссия, представляю файл **Chart.yaml** — это **манифест Helm-чарта**, обязательный файл, который описывает метаданные пакета приложения для Kubernetes. Без него Helm не сможет распознать директорию как валидный чарт.

Рассмотрим каждое поле подробно. **apiVersion: v2** указывает версию API спецификации Helm. Существует две версии: **v1** — устаревшая, для Helm 2, и **v2** — современная, для Helm 3. Версия v2 поддерживает встроенное объявление зависимостей прямо в Chart.yaml, без отдельного файла requirements.yaml, что упрощает структуру проекта. Выбор v2 — это требование к актуальности и совместимости с современным инструментарием.

Поле **name** задаёт имя чарта — `bank-of-anthos`. Это имя используется при операциях установки, обновления и поиска. Оно должно соответствовать имени директории чарта и подчиняется правилам DNS-имён: только строчные буквы, цифры и дефисы.

**description** — это человекочитаемое описание. Я указал, что чарт разворачивает **шесть микросервисов, две базы данных и фронтенд**. Это важно для команды и для каталогизации чартов в репозиториях типа Artifact Hub: описание отображается при поиске и помогает быстро понять назначение пакета.

Поле **type** имеет значение **application**. В Helm существует два типа чартов: **application** — это обычные приложения, которые разворачиваются в кластер, и **library** — вспомогательные чарты, которые содержат только переиспользуемые шаблоны и не могут быть установлены напрямую. Наш чарт развёртывает реальное приложение, поэтому тип application.

Особое внимание стоит уделить **разделению двух версий**. **version: 0.1.0** — это версия самого чарта, она следует семантическому версионированию и должна **инкрементироваться при любом изменении шаблонов или values**. А **appVersion: "v0.6.0"** — это версия упаковываемого приложения, то есть Bank of Anthos. Эти версии независимы: можно править чарт, не меняя приложение, и наоборот. Это даёт гибкость при сопровождении.

Таким образом, Chart.yaml — это **паспорт чарта**, обеспечивающий идентификацию, версионирование и совместимость в экосистеме Helm.