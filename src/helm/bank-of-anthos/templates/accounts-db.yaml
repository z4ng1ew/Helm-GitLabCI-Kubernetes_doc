apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-db
  labels:
    app: accounts-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-db
  template:
    metadata:
      labels:
        app: accounts-db
    spec:
      containers:
        - name: accounts-db
          image: "{{ .Values.imageRepo }}/accounts-db:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: accounts-db-config
          ports:
            - name: tcp
              containerPort: 5432
          volumeMounts:
            - name: postgresdb
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: postgresdb
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-db
  labels:
    app: accounts-db
spec:
  type: ClusterIP
  selector:
    app: accounts-db
  ports:
    - name: tcp
      port: 5432
      targetPort: 5432














# Построчный комментарий к манифесту

```yaml
apiVersion: apps/v1          # Версия API Kubernetes для объекта Deployment
kind: Deployment             # Тип ресурса — Deployment (управляет подами)
metadata:                    # Метаданные объекта
  name: accounts-db          # Имя деплоймента
  labels:                    # Метки для идентификации
    app: accounts-db         # Метка приложения
spec:                        # Спецификация деплоймента
  replicas: 1                # Количество реплик пода = 1
  selector:                  # Селектор для связи Deployment ↔ Pod
    matchLabels:
      app: accounts-db       # Выбирает поды с этой меткой
  template:                  # Шаблон создаваемого пода
    metadata:
      labels:
        app: accounts-db     # Метка пода (должна совпадать с селектором)
    spec:
      containers:            # Список контейнеров в поде
        - name: accounts-db  # Имя контейнера
          image: "{{ .Values.imageRepo }}/accounts-db:{{ .Values.imageTag }}"
                             # Образ берётся из Helm values (репозиторий + тег)
          imagePullPolicy: {{ .Values.imagePullPolicy }}
                             # Политика загрузки образа (Always / IfNotPresent)
          envFrom:           # Подгрузка переменных окружения
            - configMapRef:
                name: accounts-db-config   # Из ConfigMap accounts-db-config
          ports:
            - name: tcp
              containerPort: 5432          # Порт PostgreSQL внутри контейнера
          volumeMounts:                    # Монтирование томов
            - name: postgresdb
              mountPath: /var/lib/postgresql/data  # Куда монтируем (data PG)
              subPath: postgres                    # Поддиректория тома
          resources:                       # Ограничения ресурсов
            requests:
              cpu: 100m                    # Гарантированно 0.1 CPU
              memory: 256Mi                # Гарантированно 256 МБ RAM
            limits:
              memory: 512Mi                # Максимум 512 МБ RAM
      volumes:
        - name: postgresdb
          emptyDir: {}                     # Временное хранилище (живёт с подом)
---
apiVersion: v1               # API для Service
kind: Service                # Тип ресурса — Service
metadata:
  name: accounts-db          # Имя сервиса (используется как DNS-имя)
  labels:
    app: accounts-db
spec:
  type: ClusterIP            # Доступен только внутри кластера
  selector:
    app: accounts-db         # Направляет трафик на поды с этой меткой
  ports:
    - name: tcp
      port: 5432             # Порт сервиса
      targetPort: 5432       # Порт пода, куда пробрасывается трафик
```

---

# Монолог для защиты (~300 символов)

> Данный манифест разворачивает базу данных PostgreSQL для микросервиса accounts. Deployment запускает один под с контейнером, конфигурируемым через ConfigMap и Helm-шаблоны. Заданы ресурсные лимиты для стабильности. Том emptyDir хранит данные временно. Service типа ClusterIP открывает доступ к БД на порту 5432 внутри кластера, обеспечивая связь с другими микросервисами по DNS-имени accounts-db.