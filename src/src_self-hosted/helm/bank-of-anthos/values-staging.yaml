# Staging Values Override для Bank of Anthos

## Конфигурация с построчными комментариями

```yaml
# Staging: по 1 реплике, предбоевая среда
replicas:                            # Переопределение количества реплик для staging-окружения
  frontend: 1                        # Веб-интерфейс — 1 реплика (экономия ресурсов)
  userservice: 1                     # Сервис пользователей — 1 реплика
  contacts: 1                        # Сервис контактов — 1 реплика
  balancereader: 1                   # Чтение баланса — 1 реплика
  ledgerwriter: 1                    # Запись в журнал — 1 реплика
  transactionhistory: 1              # История транзакций — 1 реплика
                                     # Минимальная конфигурация — staging не требует HA

ingress:                             # Настройки внешнего доступа
  enabled: true                      # Ingress включён
  className: "nginx"                 # NGINX Ingress Controller
  host: "bank-staging.spectrew.online"
                                     # Поддомен staging — отделён от production
  tls:                               # Настройки HTTPS
    enabled: true                    # TLS включён (тестирование сертификатов перед prod)
    secretName: "wildcard-spectrew-tls"
                                     # Тот же wildcard-сертификат, что и в prod (*.spectrew.online)

antiAffinity:                        # Распределение подов по нодам
  enabled: true                      # Включено — поведение идентично prod для верности тестирования
```

---

## Монолог для защиты (≈300 слов)

Уважаемая комиссия, представляю **staging-override values-файл** для Helm-чарта Bank of Anthos. Назначение staging-окружения — быть **предбоевой средой**, максимально приближенной к production, но с меньшим потреблением ресурсов. Здесь проводится финальная проверка релиза перед выкатом в prod: smoke-тесты, интеграционные тесты, UAT-тестирование.

Главное отличие от production — **по одной реплике на каждый stateless-сервис**. Это сознательное решение: staging не обслуживает реальных пользователей, поэтому отказоустойчивость в виде нескольких реплик избыточна. Одна реплика **в два раза экономит ресурсы кластера** — CPU, память и сетевые ресурсы. Если staging-окружение окажется недоступно на несколько минут во время rolling-update — это не критично, в отличие от prod.

Тем не менее, важно подчеркнуть принцип **environment parity** — паритета окружений из методологии **Twelve-Factor App**. Чем сильнее staging отличается от prod, тем выше риск, что баги, не обнаруженные в staging, проявятся в production. Поэтому в staging сохранены **те же компоненты, те же образы, те же зависимости, тот же Helm-чарт**. Различается только масштаб.

Блок **ingress** настроен на отдельный поддомен — **bank-staging.spectrew.online**. Разделение по поддоменам, а не по портам или путям, даёт чистую изоляцию: cookies, CORS-политики, кеши браузера работают независимо для двух окружений. Пользователи и тестировщики не путают staging с prod.

Особо отмечу, что **TLS включён в staging**. Это не всегда очевидное решение: многие команды отключают HTTPS в нижних окружениях для упрощения. Однако включение TLS в staging позволяет проверить **корректность сертификатов, redirect'ов HTTP→HTTPS, mixed-content проблем** ещё до prod. Используется тот же **wildcard-сертификат** `*.spectrew.online`, что покрывает оба поддомена одним Secret — это экономит ресурсы cert-manager и упрощает управление.

**antiAffinity оставлен включённым** — даже при одной реплике это не вредит, а при будущем масштабировании сразу начнёт работать корректно. Кроме того, это сохраняет идентичность конфигурации с prod, что снова работает на принцип environment parity.

Итог: staging-конфигурация — это **уменьшенная, но архитектурно идентичная копия production**, обеспечивающая надёжное тестирование.