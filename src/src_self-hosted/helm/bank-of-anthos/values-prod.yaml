# Production Values Override для Bank of Anthos

## Конфигурация с построчными комментариями

```yaml
# Prod: по 2 реплики на stateless-сервисы для отказоустойчивости.
# Базы данных (accountsDb, ledgerDb) остаются по 1 — они stateful.
replicas:                            # Переопределение количества реплик для prod-окружения
  frontend: 2                        # Веб-интерфейс — 2 реплики для HA (high availability)
  userservice: 2                     # Сервис пользователей — 2 реплики для балансировки нагрузки
  contacts: 2                        # Сервис контактов — 2 реплики
  balancereader: 2                   # Чтение баланса — 2 реплики (read-heavy сервис)
  ledgerwriter: 2                    # Запись в журнал — 2 реплики (идемпотентные операции)
  transactionhistory: 2              # История транзакций — 2 реплики
                                     # БД (accounts-db, ledger-db) не указаны — остаются по 1 из базовых values

ingress:                             # Переопределение настроек внешнего доступа
  enabled: true                      # Ingress включён
  className: "nginx"                 # Используется NGINX Ingress Controller
  host: "bank.spectrew.online"       # Реальный production-домен (вместо nip.io)
  tls:                               # Настройки HTTPS
    enabled: true                    # TLS включён — обязательно для production
    secretName: "wildcard-spectrew-tls"
                                     # Имя Secret с wildcard-сертификатом *.spectrew.online

antiAffinity:                        # Настройка распределения подов
  enabled: true                      # Включено — реплики разносятся по разным нодам
```

---

## Монолог для защиты (≈300 слов)

Уважаемая комиссия, представляю **production-override values-файл** для Helm-чарта Bank of Anthos. Этот файл реализует ключевой принцип DevOps — **разделение конфигурации по окружениям**. Базовый `values.yaml` содержит общие настройки, а этот файл переопределяет только те параметры, которые должны отличаться в production. При деплое он подключается через `helm -f values-prod.yaml`, и значения **сливаются с базовыми по приоритету**.

Главное изменение — **масштабирование stateless-сервисов до двух реплик**. Это даёт два критичных преимущества. Первое — **отказоустойчивость**: при падении одной реплики вторая продолжает обслуживать запросы, и пользователи не замечают сбоя. Второе — **rolling-update без даунтайма**: Kubernetes может последовательно обновлять поды, всегда оставляя минимум одну рабочую реплику. С одной репликой rolling-update неизбежно приводит к кратковременной недоступности.

Особо подчеркну, что в комментарии явно зафиксировано: **базы данных остаются с одной репликой**, потому что они **stateful**. Простое увеличение реплик PostgreSQL приведёт к конкурентному доступу к одним данным и повреждению БД. Для масштабирования БД нужны специализированные решения: репликация, шардирование или операторы. Это осознанное архитектурное решение, а не упущение.

Блок **ingress** претерпевает существенные изменения. В staging использовался домен через **nip.io** — это удобный сервис для разработки, не требующий DNS-настройки. В production используется реальный домен **bank.spectrew.online**, который указывает на адрес кластера через настоящую DNS-запись. Также включён **TLS** — для production это не опция, а требование: передача банковских данных по HTTP недопустима. Используется **wildcard-сертификат** `*.spectrew.online`, что позволяет одним Secret обслуживать любые поддомены, например, api.spectrew.online или admin.spectrew.online без перевыпуска.

Параметр **antiAffinity** оставлен включённым. Это означает, что Kubernetes-планировщик будет **разносить реплики одного сервиса по разным нодам**. Без этого правила обе реплики могут оказаться на одной ноде, и её отказ приведёт к полной недоступности сервиса. Таким образом, антиаффинити превращает горизонтальное масштабирование в **реальную, а не номинальную отказоустойчивость**.

Итог: минимальный override-файл реализует переход от демо к production-уровню.