imageRepo: "us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos"
imageTag: "v0.6.9"
imagePullPolicy: IfNotPresent

appVersion: "v0.6.9"

environment:
  localRoutingNum: "883745000"
  pubKeyPath: "/tmp/.ssh/publickey"
  privKeyPath: "/tmp/.ssh/privatekey"

demo:
  useDemoData: "True"
  username: "testuser"
  password: "bankofanthos"

jwt:
  secretName: "jwt-key"
  privateKey: ""
  publicKey: ""

accountsDb:
  postgresDb: "accounts-db"
  postgresUser: "accounts-admin"
  postgresPassword: "accounts-pwd"
ledgerDb:
  postgresDb: "postgresdb"
  postgresUser: "admin"
  postgresPassword: "password"

replicas:
  frontend: 1
  userservice: 1
  contacts: 1
  balancereader: 1
  ledgerwriter: 1
  transactionhistory: 1

loadgenerator:
  enabled: false
  users: 5

ingress:
  enabled: true
  className: "nginx"
  host: "bank.10.174.8.95.nip.io"
  tls:
    enabled: false
    issuer: "my-ca-issuer"
    secretName: "bank-tls"




# Антиаффинити: разносить реплики одного сервиса по разным нодам (мягкое правило)
antiAffinity:
  enabled: true



# Base values.yaml для Bank of Anthos

## Конфигурация с построчными комментариями

```yaml
imageRepo: "us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos"
                                     # Базовый путь к репозиторию образов (по умолчанию — Google Artifact Registry)
                                     # В CI переопределяется на внутренний registry через --set
imageTag: "v0.6.9"                   # Версия (тег) образов всех микросервисов
imagePullPolicy: IfNotPresent        # Политика загрузки образа: тянуть только если отсутствует на ноде

appVersion: "v0.6.9"                 # Версия приложения, прокидывается в env-переменные подов

environment:                         # Общие переменные окружения для микросервисов
  localRoutingNum: "883745000"       # Локальный банковский маршрутный номер (имитация SWIFT/BIC)
  pubKeyPath: "/tmp/.ssh/publickey"  # Путь к публичному ключу JWT внутри контейнера
  privKeyPath: "/tmp/.ssh/privatekey" # Путь к приватному ключу JWT внутри контейнера

demo:                                # Настройки демо-режима
  useDemoData: "True"                # Включить генерацию тестовых данных при первом запуске
  username: "testuser"               # Логин демо-пользователя
  password: "bankofanthos"           # Пароль демо-пользователя

jwt:                                 # Настройки JWT-аутентификации между сервисами
  secretName: "jwt-key"              # Имя Kubernetes Secret с ключами
  privateKey: ""                     # Приватный ключ (пусто = берётся из существующего Secret)
  publicKey: ""                      # Публичный ключ (аналогично)

accountsDb:                          # Параметры подключения к БД аккаунтов
  postgresDb: "accounts-db"          # Имя базы данных
  postgresUser: "accounts-admin"     # Пользователь PostgreSQL
  postgresPassword: "accounts-pwd"   # Пароль (в prod должен храниться в Secret)
ledgerDb:                            # Параметры подключения к БД журнала транзакций
  postgresDb: "postgresdb"           # Имя базы данных
  postgresUser: "admin"              # Пользователь PostgreSQL
  postgresPassword: "password"       # Пароль (в prod должен храниться в Secret)

replicas:                            # Количество реплик каждого микросервиса (минимум для базового запуска)
  frontend: 1                        # Веб-интерфейс
  userservice: 1                     # Сервис пользователей
  contacts: 1                        # Сервис контактов
  balancereader: 1                   # Чтение баланса
  ledgerwriter: 1                    # Запись в журнал
  transactionhistory: 1              # История транзакций

loadgenerator:                       # Нагрузочный генератор (Locust)
  enabled: false                     # По умолчанию выключен — не нагружает кластер
  users: 5                           # Количество виртуальных пользователей при включении

ingress:                             # Настройки внешнего доступа
  enabled: true                      # Ingress создаётся
  className: "nginx"                 # IngressClass — NGINX Ingress Controller
  host: "bank.10.174.8.95.nip.io"    # Хост через nip.io (резолвится в IP без настройки DNS)
  tls:                               # Настройки HTTPS
    enabled: false                   # TLS выключен по умолчанию (демо-уровень)
    issuer: "my-ca-issuer"           # cert-manager Issuer для выпуска сертификата
    secretName: "bank-tls"           # Secret для хранения TLS-сертификата

# Антиаффинити: разносить реплики одного сервиса по разным нодам (мягкое правило)
antiAffinity:                        # Настройка распределения подов
  enabled: true                      # Включено — повышает отказоустойчивость
```

---

## Монолог для защиты (≈300 слов)

Уважаемая комиссия, представляю **базовый values.yaml** Helm-чарта Bank of Anthos. Этот файл — **единая точка конфигурации** всего приложения. Он содержит значения по умолчанию, которые могут быть переопределены через override-файлы окружений (`values-staging.yaml`, `values-prod.yaml`) или флаги `--set` в CI/CD.

В верхней части задаются **параметры образов**: репозиторий, тег и политика загрузки. `IfNotPresent` оптимизирует запуск — образ не скачивается повторно, если уже есть на ноде. В CI/CD-пайплайне эти значения **переопределяются на лету**: вместо Google Artifact Registry подставляется внутренний registry `10.174.8.95:30500`, а тег заменяется на SHA коммита для уникальности артефактов.

Блок **environment** содержит общие переменные. Особо выделю пути к JWT-ключам — приложение реализует **межсервисную аутентификацию через JWT**: userservice выпускает токены приватным ключом, остальные сервисы валидируют их публичным. Это реализует **zero-trust** подход внутри кластера.

Блок **demo** включает генерацию тестовых данных. Это удобно для презентаций, но в production должен отключаться. **Параметры баз данных** разделены на два блока: accountsDb и ledgerDb — это две **независимые PostgreSQL-инстанции**, что соответствует принципу **database per service** микросервисной архитектуры. Каждый сервис владеет своими данными, и нет связности через общую БД.

Секция **replicas** задаёт минимальную конфигурацию — по одной реплике. В override для prod это масштабируется до двух. Stateful-компоненты (БД) не масштабируются на уровне values — это сознательное архитектурное ограничение.

**Loadgenerator** отключён — он нужен только для нагрузочного тестирования и не должен работать постоянно.

Блок **ingress** конфигурирует внешний доступ. Использование **nip.io** избавляет от настройки реального DNS: домен `bank.10.174.8.95.nip.io` автоматически резолвится в IP `10.174.8.95`. TLS выключен в базе, но в override для prod включается с реальным сертификатом.

Наконец, **antiAffinity** включён по умолчанию. Это правило заставляет планировщик размещать реплики одного сервиса на **разных нодах**. Используется мягкое правило (preferred), что не блокирует деплой при дефиците нод, но повышает **отказоустойчивость** при их наличии.

Итог: values.yaml — это **гибкая, безопасная и многоокруженная конфигурация**.