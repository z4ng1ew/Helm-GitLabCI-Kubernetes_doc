stages:
  - build
  - test
  - staging
  - prod

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  CHART: "src/helm/bank-of-anthos"
  DOCKERHUB_USER: "zangievmovsar"

build:
  stage: build
  image:
    name: moby/buildkit:latest
    entrypoint: [""]
  variables:
    BUILDKIT_HOST: tcp://buildkitd.buildkit.svc.cluster.local:1234
    REGISTRY: 10.174.8.95:30500
  parallel:
    matrix:
      - SERVICE: frontend
        CONTEXT: src/bank-of-anthos/src/frontend
      - SERVICE: userservice
        CONTEXT: src/bank-of-anthos/src/accounts/userservice
      - SERVICE: contacts
        CONTEXT: src/bank-of-anthos/src/accounts/contacts
      - SERVICE: accounts-db
        CONTEXT: src/bank-of-anthos/src/accounts/accounts-db
      - SERVICE: ledger-db
        CONTEXT: src/bank-of-anthos/src/ledger/ledger-db
      - SERVICE: balancereader
        CONTEXT: src/bank-of-anthos/src/ledger/balancereader
      - SERVICE: ledgerwriter
        CONTEXT: src/bank-of-anthos/src/ledger/ledgerwriter
      - SERVICE: transactionhistory
        CONTEXT: src/bank-of-anthos/src/ledger/transactionhistory
  script:
    - >-
      buildctl
      --addr "$BUILDKIT_HOST"
      build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR/$CONTEXT"
      --local dockerfile="$CI_PROJECT_DIR/$CONTEXT"
      --output type=image,name="$REGISTRY/$SERVICE:$IMAGE_TAG",push=true,registry.insecure=true

test-java:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  parallel:
    matrix:
      - DIR: src/bank-of-anthos/src/ledger/balancereader
      - DIR: src/bank-of-anthos/src/ledger/ledgerwriter
      - DIR: src/bank-of-anthos/src/ledger/transactionhistory
  script:
    - cd "$DIR"
    - mvn -B test

test-python:
  stage: test
  image: python:3.12-slim
  parallel:
    matrix:
      - DIR: src/bank-of-anthos/src/accounts/userservice
      - DIR: src/bank-of-anthos/src/accounts/contacts
  script:
    - cd "$DIR"
    - pip install --no-cache-dir -r requirements.txt
    - PYTHONPATH=. python -m pytest tests/ -v

.deploy:
  image: alpine/k8s:1.30.2
  script:
    - |
      JWT_ARGS=""
      if [ -n "$JWT_PRIVATE_KEY" ] && [ -n "$JWT_PUBLIC_KEY" ]; then
        JWT_ARGS="--set-file jwt.privateKey=$JWT_PRIVATE_KEY --set-file jwt.publicKey=$JWT_PUBLIC_KEY"
      fi
    - >-
      helm upgrade --install boa "$CHART"
      -n "$NS"
      --set imageRepo="10.174.8.95:30500"
      --set imageTag="$IMAGE_TAG"
      --set appVersion="$IMAGE_TAG"
      --set ingress.host="$HOST"
      $JWT_ARGS
      --wait --timeout 5m
    - kubectl get pods -n "$NS"

deploy-staging:
  extends: .deploy
  stage: staging
  variables:
    NS: staging
    HOST: bank-staging.10.174.8.95.nip.io
  environment:
    name: staging
    url: http://bank-staging.10.174.8.95.nip.io

deploy-prod:
  extends: .deploy
  stage: prod
  variables:
    NS: prod
    HOST: bank.10.174.8.95.nip.io
  environment:
    name: prod
    url: http://bank.10.174.8.95.nip.io
  when: manual