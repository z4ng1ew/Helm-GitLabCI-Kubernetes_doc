# Построчный комментарий к `.gitlab-ci.yml`

```yaml
stages:                      # Определение этапов пайплайна (выполняются по порядку)
  - build                    # Сборка Docker-образов
  - test                     # Запуск автотестов
  - staging                  # Деплой в тестовое окружение
  - prod                     # Деплой в продакшн

variables:                   # Глобальные переменные пайплайна
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"   # Тег образа = короткий хеш коммита
  CHART: "src/helm/bank-of-anthos"    # Путь к Helm-чарту приложения
  DOCKERHUB_USER: "zangievmovsar"     # Пользователь Docker Hub

build:                       # Джоба сборки образов
  stage: build               # Принадлежит стадии build
  image:                     # Образ раннера — Kaniko (сборка без Docker daemon)
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]         # Сброс entrypoint для возможности запускать shell
  parallel:                  # Параллельный запуск джобы по матрице
    matrix:                  # Матрица: для каждого сервиса свой контекст сборки
      - SERVICE: frontend
        CONTEXT: src/bank-of-anthos/src/frontend
      - SERVICE: userservice
        CONTEXT: src/bank-of-anthos/src/accounts/userservice
      - SERVICE: contacts
        CONTEXT: src/bank-of-anthos/src/accounts/contacts
      - SERVICE: accounts-db
        CONTEXT: src/bank-of-anthos/src/accounts/accounts-db
      - SERVICE: ledger-db
        CONTEXT: src/bank-of-anthos/src/ledger/ledger-db
      - SERVICE: balancereader
        CONTEXT: src/bank-of-anthos/src/ledger/balancereader
      - SERVICE: ledgerwriter
        CONTEXT: src/bank-of-anthos/src/ledger/ledgerwriter
      - SERVICE: transactionhistory
        CONTEXT: src/bank-of-anthos/src/ledger/transactionhistory
  script:
    - |
      if [ -n "$DOCKERHUB_TOKEN" ]; then          # Если задан токен Docker Hub
        mkdir -p /kaniko/.docker                  # Создаём папку для конфига
        AUTH=$(printf "%s:%s" "$DOCKERHUB_USER" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
                                                  # Формируем строку авторизации в base64
        echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
                                                  # Сохраняем креды для пуша в Docker Hub
      fi
    - >-                                          # Команда сборки и пуша через Kaniko
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$CONTEXT"        # Контекст сборки
      --dockerfile "$CI_PROJECT_DIR/$CONTEXT/Dockerfile"   # Путь к Dockerfile
      --destination "docker.io/$DOCKERHUB_USER/$SERVICE:$IMAGE_TAG"  # Тег с SHA
      --destination "docker.io/$DOCKERHUB_USER/$SERVICE:latest"      # Тег latest

test-java:                   # Тесты Java-сервисов
  stage: test
  image: maven:3.9-eclipse-temurin-17     # Образ с Maven и JDK 17
  parallel:
    matrix:                  # Матрица каталогов Java-сервисов
      - DIR: src/bank-of-anthos/src/ledger/balancereader
      - DIR: src/bank-of-anthos/src/ledger/ledgerwriter
      - DIR: src/bank-of-anthos/src/ledger/transactionhistory
  script:
    - cd "$DIR"              # Переход в каталог сервиса
    - mvn -B test            # Запуск тестов Maven в batch-режиме

test-python:                 # Тесты Python-сервисов
  stage: test
  image: python:3.12-slim    # Лёгкий Python-образ
  parallel:
    matrix:
      - DIR: src/bank-of-anthos/src/accounts/userservice
      - DIR: src/bank-of-anthos/src/accounts/contacts
  script:
    - cd "$DIR"
    - pip install --no-cache-dir -r requirements.txt pytest   # Зависимости + pytest
    - python -m pytest -q    # Запуск тестов в тихом режиме

.deploy:                     # Скрытый шаблон джобы (используется через extends)
  image: alpine/k8s:1.30.2   # Образ с helm и kubectl
  script:
    - |
      JWT_ARGS=""            # Доп. аргументы Helm для JWT-ключей
      if [ -n "$JWT_PRIVATE_KEY" ] && [ -n "$JWT_PUBLIC_KEY" ]; then
        JWT_ARGS="--set-file jwt.privateKey=$JWT_PRIVATE_KEY --set-file jwt.publicKey=$JWT_PUBLIC_KEY"
                             # Передача файлов ключей в чарт
      fi
    - >-                     # Установка/обновление релиза Helm
      helm upgrade --install boa "$CHART"
      -n "$NS"               # Namespace (задаётся в наследниках)
      --set imageRepo="docker.io/$DOCKERHUB_USER"   # Репозиторий образов
      --set imageTag="$IMAGE_TAG"                   # Тег образов
      --set appVersion="$IMAGE_TAG"                 # Версия приложения
      --set ingress.host="$HOST"                    # Хост Ingress
      $JWT_ARGS                                     # Аргументы JWT (если есть)
      --wait --timeout 5m                           # Ждать готовности до 5 минут
    - kubectl get pods -n "$NS"                     # Проверка состояния подов

deploy-staging:              # Деплой в staging
  extends: .deploy           # Наследует шаблон .deploy
  stage: staging
  variables:
    NS: staging              # Namespace staging
    HOST: bank-staging.10.174.8.95.nip.io   # DNS через nip.io
  environment:
    name: staging            # Окружение в GitLab
    url: http://bank-staging.10.174.8.95.nip.io     # Ссылка в UI GitLab

deploy-prod:                 # Деплой в продакшн
  extends: .deploy
  stage: prod
  variables:
    NS: prod
    HOST: bank.10.174.8.95.nip.io
  environment:
    name: prod
    url: http://bank.10.174.8.95.nip.io
  when: manual               # Запускается только вручную (защита прода)
```

---

# Монолог для защиты (~300 символов)

> Пайплайн GitLab CI/CD реализует полный цикл доставки приложения Bank of Anthos. На стадии build с помощью Kaniko параллельно собираются восемь микросервисов и пушатся в Docker Hub с тегом коммита. Далее автоматически запускаются Java- и Python-тесты. Деплой в staging выполняется автоматически через Helm, а в prod — вручную, что обеспечивает контроль и безопасность релизов.

















# ============================================================
#  CI/CD для Bank of Anthos (проект ДО14, Школа 21)
#  4 стадии: build -> test -> staging -> prod
#
#  ДВА РЕЖИМА СЕКРЕТОВ (файл одинаковый для обоих):
#    * Режим "кластер" (сейчас): токен Docker Hub примонтирован
#      к подам заданий секретом dockerhub-auth; ключи JWT лежат
#      секретом jwt-key в namespace staging/prod. Переменные в
#      GitLab НЕ нужны.
#    * Режим "GitLab" (потом): если заданы переменные
#      DOCKERHUB_TOKEN и JWT_PRIVATE_KEY/JWT_PUBLIC_KEY — пайплайн
#      возьмёт их. Достаточно добавить переменные, файл не менять.
#
#  Деплой идёт "изнутри": раннер крутит задания подами в k3s,
#  helm/kubectl используют доступ пода (in-cluster), kubeconfig не нужен.
# ============================================================

stages:
  - build
  - test
  - staging
  - prod

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"   # тег = короткий хэш коммита
  CHART: "src/helm/bank-of-anthos"    # путь к Helm-чарту от корня репозитория
  DOCKERHUB_USER: "ЗАМЕНИ_НА_СВОЙ_ЛОГИН_DOCKERHUB"   # логин — не секрет, можно прямо тут

# ------------------------------------------------------------
#  BUILD: Kaniko собирает образ каждого сервиса и пушит в Docker Hub
# ------------------------------------------------------------
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  parallel:
    matrix:
      - SERVICE: frontend
        CONTEXT: src/bank-of-anthos/src/frontend
      - SERVICE: userservice
        CONTEXT: src/bank-of-anthos/src/accounts/userservice
      - SERVICE: contacts
        CONTEXT: src/bank-of-anthos/src/accounts/contacts
      - SERVICE: accounts-db
        CONTEXT: src/bank-of-anthos/src/accounts/accounts-db
      - SERVICE: ledger-db
        CONTEXT: src/bank-of-anthos/src/ledger/ledger-db
      - SERVICE: balancereader
        CONTEXT: src/bank-of-anthos/src/ledger/balancereader
      - SERVICE: ledgerwriter
        CONTEXT: src/bank-of-anthos/src/ledger/ledgerwriter
      - SERVICE: transactionhistory
        CONTEXT: src/bank-of-anthos/src/ledger/transactionhistory
  script:
    - |
      if [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "Режим GitLab-переменных: создаю config.json из токена."
        mkdir -p /kaniko/.docker
        AUTH=$(printf "%s:%s" "$DOCKERHUB_USER" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
        echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
      else
        echo "Режим кластерного секрета: использую примонтированный /kaniko/.docker/config.json."
      fi
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$CONTEXT"
      --dockerfile "$CI_PROJECT_DIR/$CONTEXT/Dockerfile"
      --destination "docker.io/$DOCKERHUB_USER/$SERVICE:$IMAGE_TAG"
      --destination "docker.io/$DOCKERHUB_USER/$SERVICE:latest"

# ------------------------------------------------------------
#  TEST: юнит-тесты сервисов с бизнес-логикой
# ------------------------------------------------------------
test-java:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  parallel:
    matrix:
      - DIR: src/bank-of-anthos/src/ledger/balancereader
      - DIR: src/bank-of-anthos/src/ledger/ledgerwriter
      - DIR: src/bank-of-anthos/src/ledger/transactionhistory
  script:
    - cd "$DIR"
    - mvn -B test

test-python:
  stage: test
  image: python:3.12-slim
  parallel:
    matrix:
      - DIR: src/bank-of-anthos/src/accounts/userservice
      - DIR: src/bank-of-anthos/src/accounts/contacts
  script:
    - cd "$DIR"
    - pip install --no-cache-dir -r requirements.txt pytest
    - python -m pytest -q

# ------------------------------------------------------------
#  Шаблон деплоя (helm). NS/HOST задаются в каждой стадии.
#  JWT-ключи добавляются только если заданы переменные (режим GitLab);
#  иначе используется заранее созданный секрет jwt-key в namespace.
# ------------------------------------------------------------
.deploy:
  image: alpine/k8s:1.30.2          # внутри есть helm и kubectl
  script:
    - |
      JWT_ARGS=""
      if [ -n "$JWT_PRIVATE_KEY" ] && [ -n "$JWT_PUBLIC_KEY" ]; then
        JWT_ARGS="--set-file jwt.privateKey=$JWT_PRIVATE_KEY --set-file jwt.publicKey=$JWT_PUBLIC_KEY"
      fi
    - >-
      helm upgrade --install boa "$CHART"
      -n "$NS"
      --set imageRepo="docker.io/$DOCKERHUB_USER"
      --set imageTag="$IMAGE_TAG"
      --set appVersion="$IMAGE_TAG"
      --set ingress.host="$HOST"
      $JWT_ARGS
      --wait --timeout 5m
    - kubectl get pods -n "$NS"

deploy-staging:
  extends: .deploy
  stage: staging
  variables:
    NS: staging
    HOST: bank-staging.10.174.8.95.nip.io
  environment:
    name: staging
    url: http://bank-staging.10.174.8.95.nip.io

deploy-prod:
  extends: .deploy
  stage: prod
  variables:
    NS: prod
    HOST: bank.10.174.8.95.nip.io
  environment:
    name: prod
    url: http://bank.10.174.8.95.nip.io
  when: manual           # запускается только кнопкой в GitLab